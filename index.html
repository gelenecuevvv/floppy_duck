<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Floppy duck</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: "Arial", sans-serif;
      background: linear-gradient(to bottom, #87CEEB 0%, #98FB98 100%);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow: hidden;
    }

    #gameContainer {
      position: relative;
      width: 400px;
      height: 600px;
      background: linear-gradient(to bottom, #87CEEB 0%, #98FB98 100%);
      border: 3px solid #333;
      border-radius: 10px;
      overflow: hidden;
      box-shadow: 0 10px 30px rgba(0,0,0,0.3);
    }

    #gameCanvas {
      width: 100%;
      height: 100%;
      display: block;
    }

    #startScreen {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.8);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      color: white;
      z-index: 10;
    }

    #gameOverScreen {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.8);
      display: none;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      color: white;
      z-index: 10;
    }

    .title {
      font-size: 2.5rem;
      font-weight: bold;
      margin-bottom: 1rem;
      color: #FFD700;
      text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
    }

    .subtitle {
      font-size: 1.2rem;
      margin-bottom: 2rem;
      text-align: center;
    }

    .score {
      font-size: 1.5rem;
      margin-bottom: 1rem;
      color: #FFD700;
    }

    .high-score {
      font-size: 1.2rem;
      margin-bottom: 2rem;
      color: #90EE90;
    }

    button {
      background: #FF6B6B;
      border: none;
      color: white;
      padding: 15px 30px;
      font-size: 1.2rem;
      font-weight: bold;
      border-radius: 25px;
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: 0 4px 8px rgba(0,0,0,0,0.3);
    }

    button:hover {
      background: #FF5252;
      transform: translateY(-2px);
      box-shadow: 0 6px 12px rgba(0,0,0,0.4);
    }

    button:active {
      transform: translateY(0);
    }

    .instructions {
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      color: white;
      text-align: center;
      font-size: 0.9rem;
      background: rgba(0,0,0,0.5);
      padding: 10px 20px;
      border-radius: 15px;
    }

    .cloud {
      position: absolute;
      background: white;
      border-radius: 50px;
      opacity: 0.8;
      animation: float 20s infinite linear;
    }

    .cloud:before {
      content: '';
      position: absolute;
      background: white;
      border-radius: 50px;
    }

    .cloud:after {
      content: '';
      position: absolute;
      background: white;
      border-radius: 50px;
    }

    @keyframes float {
      0% { transform: translateX(-100px); }
      100% { transform: translateX(450px); }
    }

    .cloud1 {
      width: 60px;
      height: 20px;
      top: 20%;
      animation-duration: 15s;
    }

    .cloud2 {
      width: 80px;
      height: 25px;
      top: 40%;
      animation-duration: 20s;
    }

    .cloud3 {
      width: 50px;
      height: 15px;
      top: 60%;
      animation-duration: 18s;
    }
  </style>
</head>
<body>
  <div id="gameContainer">
    <canvas id="gameCanvas"></canvas>
    
    <div id="startScreen">
      <h1 class="title">Floppy Duck</h1>
      <p class="subtitle">Click or press SPACE to make the duck fly!</p>
      <button onclick="startGame()">Start Game</button>
      <div class="instructions">
        Use SPACE or CLICK to flap your wings and quack!<br>
        <!-- Enable audio to hear duck sounds! -->
      </div>
    </div>

    <div id="gameOverScreen">
      <h1 class="title">Game Over!</h1>
      <div class="score">Score: <span id="finalScore">0</span></div>
      <div class="high-score">High Score: <span id="highScore">0</span></div>
      <button onclick="restartGame()">Play Again</button>
    </div>

    <!-- Background clouds -->
    <div class="cloud cloud1"></div>
    <div class="cloud cloud2"></div>
    <div class="cloud cloud3"></div>
  </div>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const startScreen = document.getElementById('startScreen');
    const gameOverScreen = document.getElementById('gameOverScreen');
    const finalScoreEl = document.getElementById('finalScore');
    const highScoreEl = document.getElementById('highScore');

    // Set canvas size
    canvas.width = 400;
    canvas.height = 600;

    // Game variables
    let gameState = 'start'; // 'start', 'playing', 'gameOver'
    let score = 0;
    let highScore = localStorage.getItem('flappyHighScore') || 0;
    let gameSpeed = 2;

    // Duck object
    const duck = {
      x: 80,
      y: canvas.height / 2,
      width: 40,
      height: 35,
      velocity: 0,
      gravity: 0.5,
      jumpPower: -8,
      color: '#FFF8DC',
      wingFlap: 0
    };

    // Pipes array
    let pipes = [];
    const pipeWidth = 60;
    const pipeGap = 150;
    
    // Collectibles array
    let collectibles = [];
    let powerUps = [];
    let obstacles = [];
    
    // Game effects
    let waterSplashes = [];
    let rainDrops = [];
    
    // Audio context for duck sounds
    let audioContext;
    let quackSound;

    // Initialize audio
    function initAudio() {
      try {
        audioContext = new (window.AudioContext || window.webkitAudioContext)();
      } catch (e) {
        console.log('Audio not supported');
      }
    }
    
    // Generate quack sound
    function playQuack() {
      if (!audioContext) return;
      
      const oscillator = audioContext.createOscillator();
      const gainNode = audioContext.createGain();
      
      oscillator.connect(gainNode);
      gainNode.connect(audioContext.destination);
      
      // Create a more realistic quack sound
      oscillator.type = 'sawtooth';
      oscillator.frequency.setValueAtTime(300, audioContext.currentTime);
      oscillator.frequency.exponentialRampToValueAtTime(200, audioContext.currentTime + 0.1);
      oscillator.frequency.exponentialRampToValueAtTime(150, audioContext.currentTime + 0.2);
      
      // Volume envelope for quack
      gainNode.gain.setValueAtTime(0, audioContext.currentTime);
      gainNode.gain.linearRampToValueAtTime(0.2, audioContext.currentTime + 0.05);
      gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.25);
      
      oscillator.start(audioContext.currentTime);
      oscillator.stop(audioContext.currentTime + 0.25);
    }
    
    // Generate splash sound for collecting fish
    function playSplash() {
      if (!audioContext) return;
      
      const oscillator = audioContext.createOscillator();
      const gainNode = audioContext.createGain();
      
      oscillator.connect(gainNode);
      gainNode.connect(audioContext.destination);
      
      // Create splash sound
      oscillator.type = 'sine';
      oscillator.frequency.setValueAtTime(800, audioContext.currentTime);
      oscillator.frequency.exponentialRampToValueAtTime(200, audioContext.currentTime + 0.1);
      
      // Volume envelope
      gainNode.gain.setValueAtTime(0, audioContext.currentTime);
      gainNode.gain.linearRampToValueAtTime(0.1, audioContext.currentTime + 0.02);
      gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.1);
      
      oscillator.start(audioContext.currentTime);
      oscillator.stop(audioContext.currentTime + 0.1);
    }
    
    // Game functions
    function startGame() {
      gameState = 'playing';
      startScreen.style.display = 'none';
      gameOverScreen.style.display = 'none';
      
      // Reset game variables
      score = 0;
      duck.y = canvas.height / 2;
      duck.velocity = 0;
      pipes = [];
      collectibles = [];
      powerUps = [];
      obstacles = [];
      waterSplashes = [];
      rainDrops = [];
      gameSpeed = 2;
      
      // Start game loop
      gameLoop();
    }

    function restartGame() {
      startGame();
    }

    function gameOver() {
      gameState = 'gameOver';
      finalScoreEl.textContent = score;
      
      if (score > highScore) {
        highScore = score;
        localStorage.setItem('flappyHighScore', highScore);
      }
      
      highScoreEl.textContent = highScore;
      gameOverScreen.style.display = 'flex';
    }

    function updateDuck() {
      // Apply gravity
      duck.velocity += duck.gravity;
      duck.y += duck.velocity;
      duck.wingFlap += 0.3;

      // Keep duck on screen
      if (duck.y < 0) {
        duck.y = 0;
        duck.velocity = 0;
      }
      if (duck.y + duck.height > canvas.height) {
        gameOver();
      }
    }

    function jump() {
      if (gameState === 'playing') {
        duck.velocity = duck.jumpPower;
        // Play quack sound
        playQuack();
        duck.wingFlap = 0;
      }
    }

    function updatePipes() {
      // Add new pipes
      if (pipes.length === 0 || pipes[pipes.length - 1].x < canvas.width - 200) {
        const pipeHeight = Math.random() * (canvas.height - pipeGap - 100) + 50;
        pipes.push({
          x: canvas.width,
          topHeight: pipeHeight,
          bottomY: pipeHeight + pipeGap,
          bottomHeight: canvas.height - (pipeHeight + pipeGap),
          passed: false
        });
        
        // Add collectibles near pipes
        if (Math.random() < 0.3) {
          collectibles.push({
            x: canvas.width + 30,
            y: pipeHeight + pipeGap / 2 + Math.random() * 50 - 25,
            type: 'fish',
            size: 8,
            bobOffset: Math.random() * Math.PI * 2
          });
        }
        
        // Add power-ups occasionally
        if (Math.random() < 0.1) {
          powerUps.push({
            x: canvas.width + 30,
            y: pipeHeight + pipeGap / 2 + Math.random() * 50 - 25,
            type: Math.random() < 0.5 ? 'speed' : 'shield',
            size: 12,
            bobOffset: Math.random() * Math.PI * 2
          });
        }
        
        // Add floating obstacles occasionally
        if (Math.random() < 0.2) {
          obstacles.push({
            x: canvas.width + 30,
            y: pipeHeight + pipeGap / 2 + Math.random() * 50 - 25,
            type: Math.random() < 0.5 ? 'lilypad' : 'rock',
            size: 15,
            bobOffset: Math.random() * Math.PI * 2
          });
        }
      }

      // Update pipe positions
      for (let i = pipes.length - 1; i >= 0; i--) {
        pipes[i].x -= gameSpeed;

        // Remove pipes that are off screen
        if (pipes[i].x + pipeWidth < 0) {
          pipes.splice(i, 1);
          continue;
        }

        // Check for scoring
        if (!pipes[i].passed && pipes[i].x + pipeWidth < duck.x) {
          pipes[i].passed = true;
          score++;
          gameSpeed += 0.1; // Increase difficulty
        }

        // Check for collision
        if (checkCollision(pipes[i])) {
          gameOver();
        }
      }
    }
    
    function updateCollectibles() {
      for (let i = collectibles.length - 1; i >= 0; i--) {
        collectibles[i].x -= gameSpeed;
        collectibles[i].bobOffset += 0.1;
        
        // Remove off-screen collectibles
        if (collectibles[i].x + collectibles[i].size < 0) {
          collectibles.splice(i, 1);
          continue;
        }
        
        // Check for collection
        if (checkCollectibleCollision(collectibles[i])) {
          collectibles.splice(i, 1);
          score += 5; // Bonus points for fish
          // Add water splash effect
          waterSplashes.push({
            x: duck.x + duck.width / 2,
            y: duck.y + duck.height / 2,
            life: 20
          });
          // Play splash sound
          playSplash();
        }
      }
    }
    
    function updatePowerUps() {
      for (let i = powerUps.length - 1; i >= 0; i--) {
        powerUps[i].x -= gameSpeed;
        powerUps[i].bobOffset += 0.1;
        
        // Remove off-screen power-ups
        if (powerUps[i].x + powerUps[i].size < 0) {
          powerUps.splice(i, 1);
          continue;
        }
        
        // Check for collection
        if (checkPowerUpCollision(powerUps[i])) {
          const powerUpType = powerUps[i].type;
          powerUps.splice(i, 1);
          applyPowerUp(powerUpType);
        }
      }
    }
    
    function updateObstacles() {
      for (let i = obstacles.length - 1; i >= 0; i--) {
        obstacles[i].x -= gameSpeed;
        obstacles[i].bobOffset += 0.1;
        
        // Remove off-screen obstacles
        if (obstacles[i].x + obstacles[i].size < 0) {
          obstacles.splice(i, 1);
          continue;
        }
        
        // Check for collision
        if (checkObstacleCollision(obstacles[i])) {
          gameOver();
        }
      }
    }
    
    function updateWaterEffects() {
      // Update water splashes
      for (let i = waterSplashes.length - 1; i >= 0; i--) {
        waterSplashes[i].life--;
        if (waterSplashes[i].life <= 0) {
          waterSplashes.splice(i, 1);
        }
      }
      
      // Add rain drops occasionally
      if (Math.random() < 0.1) {
        rainDrops.push({
          x: Math.random() * canvas.width,
          y: -10,
          speed: 2 + Math.random() * 3
        });
      }
      
      // Update rain drops
      for (let i = rainDrops.length - 1; i >= 0; i--) {
        rainDrops[i].y += rainDrops[i].speed;
        if (rainDrops[i].y > canvas.height) {
          rainDrops.splice(i, 1);
        }
      }
    }

    function checkCollision(pipe) {
      const duckLeft = duck.x;
      const duckRight = duck.x + duck.width;
      const duckTop = duck.y;
      const duckBottom = duck.y + duck.height;

      const pipeLeft = pipe.x;
      const pipeRight = pipe.x + pipeWidth;

      // Check if duck is within pipe's x range
      if (duckRight > pipeLeft && duckLeft < pipeRight) {
        // Check collision with top pipe
        if (duckTop < pipe.topHeight) {
          return true;
        }
        // Check collision with bottom pipe
        if (duckBottom > pipe.bottomY) {
          return true;
        }
      }

      return false;
    }

    function checkCollectibleCollision(collectible) {
      const duckLeft = duck.x;
      const duckRight = duck.x + duck.width;
      const duckTop = duck.y;
      const duckBottom = duck.y + duck.height;
      
      return (duckRight > collectible.x && 
              duckLeft < collectible.x + collectible.size &&
              duckBottom > collectible.y && 
              duckTop < collectible.y + collectible.size);
    }
    
    function checkPowerUpCollision(powerUp) {
      const duckLeft = duck.x;
      const duckRight = duck.x + duck.width;
      const duckTop = duck.y;
      const duckBottom = duck.y + duck.height;
      
      return (duckRight > powerUp.x && 
              duckLeft < powerUp.x + powerUp.size &&
              duckBottom > powerUp.y && 
              duckTop < powerUp.y + powerUp.size);
    }
    
    function applyPowerUp(type) {
      if (type === 'speed') {
        gameSpeed *= 0.7; // Slow down temporarily
        score += 10;
      } else if (type === 'shield') {
        // Add shield effect (visual only for now)
        score += 15;
      }
    }
    
    function checkObstacleCollision(obstacle) {
      const duckLeft = duck.x;
      const duckRight = duck.x + duck.width;
      const duckTop = duck.y;
      const duckBottom = duck.y + duck.height;
      
      return (duckRight > obstacle.x && 
              duckLeft < obstacle.x + obstacle.size &&
              duckBottom > obstacle.y && 
              duckTop < obstacle.y + obstacle.size);
    }

    function drawDuck() {
      const wingOffset = Math.sin(duck.wingFlap) * 4;
      
      // Draw duck body (white/cream with brown accents)
      ctx.fillStyle = '#FFF8DC';
      ctx.fillRect(duck.x + 8, duck.y + 12, duck.width - 12, duck.height - 10);
      
      // Draw duck head (more duck-like shape)
      ctx.fillStyle = '#FFF8DC';
      ctx.fillRect(duck.x + 4, duck.y + 3, 26, 18);
      
      // Draw duck neck (connecting head to body)
      ctx.fillStyle = '#FFF8DC';
      ctx.fillRect(duck.x + 6, duck.y + 8, 6, 10);
      
      // Draw duck eye (black with white highlight)
      ctx.fillStyle = 'black';
      ctx.fillRect(duck.x + 18, duck.y + 6, 4, 4);
      ctx.fillStyle = 'white';
      ctx.fillRect(duck.x + 19, duck.y + 7, 1, 1);
      
      // Draw beak (orange duck beak)
      ctx.fillStyle = '#FF8C00';
      ctx.fillRect(duck.x + 26, duck.y + 8, 10, 5);
      
      // Draw beak tip
      ctx.fillStyle = '#FFD700';
      ctx.fillRect(duck.x + 32, duck.y + 9, 3, 3);
      
      // Draw wing (white with brown feathers)
      ctx.fillStyle = '#DEB887';
      ctx.fillRect(duck.x + 2, duck.y + 10 + wingOffset, 14, 10);
      ctx.fillStyle = '#FFF8DC';
      ctx.fillRect(duck.x + 4, duck.y + 12 + wingOffset, 10, 6);
      
      // Draw wing feather details
      ctx.fillStyle = '#8B4513';
      ctx.fillRect(duck.x + 5, duck.y + 13 + wingOffset, 8, 1);
      ctx.fillRect(duck.x + 5, duck.y + 15 + wingOffset, 6, 1);
      ctx.fillRect(duck.x + 5, duck.y + 17 + wingOffset, 4, 1);
      
      // Draw tail (duck tail feathers)
      ctx.fillStyle = '#DEB887';
      ctx.fillRect(duck.x - 6, duck.y + 18, 10, 8);
      ctx.fillRect(duck.x - 4, duck.y + 20, 6, 6);
      
      // Draw webbed feet (if near water)
      if (duck.y + duck.height > canvas.height - 25) {
        ctx.fillStyle = '#FF8C00';
        // Left foot
        ctx.fillRect(duck.x + 8, duck.y + duck.height - 3, 5, 3);
        ctx.fillRect(duck.x + 7, duck.y + duck.height - 2, 7, 2);
        // Right foot
        ctx.fillRect(duck.x + 18, duck.y + duck.height - 3, 5, 3);
        ctx.fillRect(duck.x + 17, duck.y + duck.height - 2, 7, 2);
      }
      
      // Draw simple outline
      ctx.strokeStyle = '#8B4513';
      ctx.lineWidth = 1;
      ctx.strokeRect(duck.x + 8, duck.y + 12, duck.width - 12, duck.height - 10);
      ctx.strokeRect(duck.x + 4, duck.y + 3, 26, 18);
      ctx.strokeRect(duck.x + 2, duck.y + 10 + wingOffset, 14, 10);
      ctx.strokeRect(duck.x - 6, duck.y + 18, 10, 8);
    }

    function drawPipes() {
      pipes.forEach(pipe => {
        // Add some variety to pipe colors
        const pipeColor = Math.random() < 0.3 ? '#32CD32' : '#228B22';
        ctx.fillStyle = pipeColor;
        
        // Top pipe
        ctx.fillRect(pipe.x, 0, pipeWidth, pipe.topHeight);
        // Bottom pipe
        ctx.fillRect(pipe.x, pipe.bottomY, pipeWidth, pipe.bottomHeight);
        
        // Pipe caps with gradient effect
        ctx.fillStyle = '#32CD32';
        ctx.fillRect(pipe.x - 5, pipe.topHeight - 20, pipeWidth + 10, 20);
        ctx.fillRect(pipe.x - 5, pipe.bottomY, pipeWidth + 10, 20);
        
        // Add some decorative elements to pipes
        ctx.fillStyle = '#90EE90';
        ctx.fillRect(pipe.x + 5, pipe.topHeight - 15, 5, 5);
        ctx.fillRect(pipe.x + 15, pipe.topHeight - 10, 5, 5);
        ctx.fillRect(pipe.x + 10, pipe.bottomY + 5, 5, 5);
        ctx.fillRect(pipe.x + 20, pipe.bottomY + 10, 5, 5);
      });
    }

    function drawBackground() {
      // Sky gradient
      const gradient = ctx.createLinearGradient(0, 0, 0, canvas.height);
      gradient.addColorStop(0, '#87CEEB');
      gradient.addColorStop(0.7, '#98FB98');
      gradient.addColorStop(1, '#20B2AA');
      ctx.fillStyle = gradient;
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      
      // Add water surface effect at bottom
      ctx.fillStyle = 'rgba(135, 206, 235, 0.3)';
      ctx.fillRect(0, canvas.height - 20, canvas.width, 20);
      
      // Add some water ripples
      for (let i = 0; i < 5; i++) {
        const x = (i * 80) + (Date.now() * 0.01) % 80;
        const y = canvas.height - 15;
        ctx.fillStyle = 'rgba(135, 206, 235, 0.2)';
        ctx.fillRect(x, y, 40, 2);
      }
    }

    function drawCollectibles() {
      collectibles.forEach(collectible => {
        const bobY = collectible.y + Math.sin(collectible.bobOffset) * 3;
        
        if (collectible.type === 'fish') {
          // Draw fish
          ctx.fillStyle = '#FF6B6B';
          ctx.fillRect(collectible.x, bobY, collectible.size, collectible.size * 0.6);
          
          // Fish tail
          ctx.fillStyle = '#FF5252';
          ctx.fillRect(collectible.x - 3, bobY + 2, 4, collectible.size * 0.4);
          
          // Fish eye
          ctx.fillStyle = 'white';
          ctx.fillRect(collectible.x + 2, bobY + 1, 2, 2);
        }
      });
    }
    
    function drawPowerUps() {
      powerUps.forEach(powerUp => {
        const bobY = powerUp.y + Math.sin(powerUp.bobOffset) * 4;
        
        if (powerUp.type === 'speed') {
          // Draw speed power-up (lightning bolt)
          ctx.fillStyle = '#FFD700';
          ctx.fillRect(powerUp.x + 2, bobY, 2, powerUp.size);
          ctx.fillRect(powerUp.x, bobY + 2, 6, 2);
          ctx.fillRect(powerUp.x + 2, bobY + 4, 2, powerUp.size - 4);
        } else if (powerUp.type === 'shield') {
          // Draw shield power-up
          ctx.fillStyle = '#87CEEB';
          ctx.fillRect(powerUp.x, bobY, powerUp.size, powerUp.size);
          ctx.fillStyle = '#4169E1';
          ctx.fillRect(powerUp.x + 1, bobY + 1, powerUp.size - 2, powerUp.size - 2);
        }
      });
    }
    
    function drawObstacles() {
      obstacles.forEach(obstacle => {
        const bobY = obstacle.y + Math.sin(obstacle.bobOffset) * 2;
        
        if (obstacle.type === 'lilypad') {
          // Draw lily pad
          ctx.fillStyle = '#32CD32';
          ctx.fillRect(obstacle.x, bobY, obstacle.size, obstacle.size * 0.6);
          
          // Lily pad details
          ctx.fillStyle = '#228B22';
          ctx.fillRect(obstacle.x + 2, bobY + 2, obstacle.size - 4, obstacle.size * 0.6 - 4);
          
          // Lily pad flower
          ctx.fillStyle = '#FF69B4';
          ctx.fillRect(obstacle.x + obstacle.size/2 - 2, bobY - 3, 4, 6);
        } else if (obstacle.type === 'rock') {
          // Draw rock
          ctx.fillStyle = '#696969';
          ctx.fillRect(obstacle.x, bobY, obstacle.size, obstacle.size * 0.8);
          
          // Rock details
          ctx.fillStyle = '#A9A9A9';
          ctx.fillRect(obstacle.x + 2, bobY + 2, obstacle.size - 4, obstacle.size * 0.8 - 4);
        }
      });
    }
    
    function drawWaterEffects() {
      // Draw water splashes
      waterSplashes.forEach(splash => {
        const alpha = splash.life / 20;
        ctx.fillStyle = `rgba(135, 206, 235, ${alpha})`;
        ctx.fillRect(splash.x - 5, splash.y - 5, 10, 10);
        ctx.fillRect(splash.x - 3, splash.y - 7, 6, 6);
        ctx.fillRect(splash.x - 7, splash.y - 3, 6, 6);
      });
      
      // Draw rain drops
      rainDrops.forEach(drop => {
        ctx.fillStyle = 'rgba(135, 206, 235, 0.6)';
        ctx.fillRect(drop.x, drop.y, 1, 8);
      });
    }

    function drawScore() {
      ctx.fillStyle = 'white';
      ctx.font = 'bold 24px Arial';
      ctx.textAlign = 'center';
      ctx.fillText(score, canvas.width / 2, 50);
      
      // Draw bonus score indicator
      if (score > 0 && score % 5 === 0) {
        ctx.fillStyle = '#FFD700';
        ctx.font = 'bold 16px Arial';
        ctx.fillText('+5 Fish Bonus!', canvas.width / 2, 80);
      }
    }

    function draw() {
      // Clear canvas
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      
      // Draw background
      drawBackground();
      
      if (gameState === 'playing') {
        // Draw game elements
        drawPipes();
        drawObstacles();
        drawCollectibles();
        drawPowerUps();
        drawDuck();
        drawWaterEffects();
        drawScore();
      }
    }

    function gameLoop() {
      if (gameState === 'playing') {
        updateDuck();
        updatePipes();
        updateObstacles();
        updateCollectibles();
        updatePowerUps();
        updateWaterEffects();
        draw();
        requestAnimationFrame(gameLoop);
      }
    }

    // Event listeners
    document.addEventListener('keydown', (e) => {
      if (e.code === 'Space') {
        e.preventDefault();
        jump();
      }
    });

    canvas.addEventListener('click', () => {
      jump();
    });

    // Initialize high score display
    highScoreEl.textContent = highScore;
    
    // Initialize audio
    initAudio();

    // Start with initial draw
    draw();
  </script>
</body>
</html>
